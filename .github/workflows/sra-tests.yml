name: SRA synthetic tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/sra-acknowledgement]
permissions:
  contents: read
jobs:
  synthetic:
    name: SRA (synthetic, no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false
      - run: python3 -I sra/acknowledge.py --self-test
