name: Reference model tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-model:
    name: Reference model (offline fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: false
      - name: Run standard-library fixture tests
        run: python3 -I safeguard_prototype.py -v
